# 知识库平台一键部署。
#   cp .env.example .env   # 按注释修改
#   docker compose up -d
#
# 只起基础组件（本机开发，接口用 backend/manage.sh 启动）：
#   docker compose up -d postgres redis minio etcd milvus
#
# 使用外部已有的组件：从 .env 的 COMPOSE_PROFILES 中去掉对应名字，并填写它的地址。

name: kb_platform

x-app: &app
  image: kb_platform-app:latest
  build:
    context: ..
    dockerfile: backend/Dockerfile
    args:
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  restart: unless-stopped
  environment:
    API_HOST: 0.0.0.0
    API_PORT: 8000
    LOG_DIR: /srv/logs
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    DB_HOST: ${DB_HOST:-postgres}
    DB_PORT: ${DB_PORT:-5432}
    DB_USER: ${DB_USER:-kb_platform}
    DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
    DB_NAME: ${DB_NAME:-kb_platform}
    REDIS_HOST: ${REDIS_HOST:-redis}
    REDIS_PORT: ${REDIS_PORT:-6379}
    REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
    MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?请在 .env 中设置 MINIO_ACCESS_KEY}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?请在 .env 中设置 MINIO_SECRET_KEY}
    MINIO_BUCKET: ${MINIO_BUCKET:-kb-platform}
    MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
    MILVUS_TOKEN: ${MILVUS_TOKEN:-}
    MILVUS_DB: ${MILVUS_DB:-default}
    EMBEDDING_URL: ${EMBEDDING_URL:-}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
    EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
    EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
    EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
    RETRIEVAL_LOG_KEEP_DAYS: ${RETRIEVAL_LOG_KEEP_DAYS:-30}
    SECRET_KEY_FILE: /srv/secrets/secret_key
    TOKEN_EXPIRE_HOURS: ${TOKEN_EXPIRE_HOURS:-12}
    UPLOAD_MAX_SIZE_MB: ${UPLOAD_MAX_SIZE_MB:-50}
  depends_on:
    postgres:
      condition: service_healthy
      required: false
    redis:
      condition: service_healthy
      required: false
    minio:
      condition: service_healthy
      required: false
    milvus:
      condition: service_healthy
      required: false

services:
  # 统一入口：管理界面的静态文件已打包在镜像里，接口请求转给 api
  nginx:
    image: kb_platform-web:latest
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    ports:
      - "${EXPOSE_PORT:-8200}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *app
    # 启动前先执行数据库迁移
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s
    volumes:
      - ./volumes/logs:/srv/logs
      - ./volumes/secrets:/srv/secrets

  worker:
    <<: *app
    command: python worker.py
    volumes:
      - ./volumes/logs:/srv/logs
      - ./volumes/secrets:/srv/secrets

  postgres:
    profiles: ["postgres"]
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-kb_platform}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-kb_platform}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-8201}:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    profiles: ["redis"]
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${DEV_REDIS_PORT:-8202}:6379"
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    profiles: ["minio"]
    # MinIO 官方的 minio/minio 镜像已从公共仓库下架。这里用的是 Milvus 官方托管的版本，
    # 与 Milvus 2.6 官方部署文件中引用的一致。
    image: ${MINIO_IMAGE:-milvusdb/minio:RELEASE.2024-12-18T13-15-44Z}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:${DEV_MINIO_PORT:-8203}:9000"
      - "127.0.0.1:${DEV_MINIO_CONSOLE_PORT:-8204}:9001"
    volumes:
      - ./volumes/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # etcd 只给 Milvus 使用
  etcd:
    profiles: ["milvus"]
    image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.16}
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - ./volumes/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 20

  milvus:
    profiles: ["milvus"]
    image: ${MILVUS_IMAGE:-milvusdb/milvus:v2.6.27}
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:${DEV_MILVUS_PORT:-8205}:19530"
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9091/healthz"]
      interval: 15s
      start_period: 60s
      timeout: 10s
      retries: 10
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
        required: false
